<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Extractor de Configuración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/litera/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container-fluid">
        <nav class="navbar navbar-expand-lg bg-white mb-4" style="padding-top: 1rem; padding-bottom: 1rem;">
        <div class="d-flex justify-content-between align-items-center w-100 px-4 flex-grow-1">
        <a class="navbar-brand form-label fs-2 mb-4 fw-bold" href="/">Extractor de Configuración Cisco / Juniper</a>
        <a class="btn btn-outline-primary btn-sm" href="/">Home</a>
        </div>
        </div>
    </nav>
    <div class="container-fluid d-flex justify-content-center">
      <div class="col-md-6">
        <textarea id="configInput" class="form-control" rows="25" placeholder="Pega aquí la configuración..."></textarea>
        <div class="mt-3 d-flex justify-content-between">
          <button class="btn btn-primary" onclick="parseConfig()">Extraer Variables</button>
          <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
        </div>
      </div>
      <div class="col-md-6">
        <h5>Variables extraídas (<span id="vendorName">-</span>)</h5>
        <pre id="results" class="bg-white p-3 border rounded" style="min-height: 400px;"></pre>
        <button id="downloadBtn" class="btn btn-success mt-3 d-none" onclick="downloadCSV()">Guardar en CSV</button>
      </div>
    </div>
  </div>

<script>
const parseUrl = "{{ url_for('config_parser.parse') }}";
const downloadCsvUrl = "{{ url_for('config_parser.download_csv') }}";
</script>

<script>
let parsedData = null;

function parseConfig() {
  const config = document.getElementById("configInput").value;
  fetch(parseUrl, {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: "config=" + encodeURIComponent(config)
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }
    parsedData = data;
    document.getElementById("vendorName").innerText = data.vendor;
    document.getElementById("results").innerText = JSON.stringify(data.variables, null, 2);
    document.getElementById("downloadBtn").classList.remove("d-none");
  });
}

function downloadCSV() {
  fetch(downloadCsvUrl, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(parsedData)
  })
  .then(res => res.blob())
  .then(blob => {
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "variables.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
}

function clearAll() {
  document.getElementById("configInput").value = "";
  document.getElementById("results").innerText = "";
  document.getElementById("vendorName").innerText = "-";
  document.getElementById("downloadBtn").classList.add("d-none");
  parsedData = null;
}
</script>
</body>
</html>
